<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alpha IA</title>
  <meta name="theme-color" content="#0d0f14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icone-192.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f14; color: #e6e8ef; font-family: system-ui, -apple-system, Roboto, sans-serif; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0d0f14; }
    #capa { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #0d0f14; transition: opacity .3s; }
    #capa.fora { opacity: 0; pointer-events: none; }
    #capa img { width: 96px; height: 96px; border-radius: 24px; }
    #capa h1 { margin: 0; font-size: 22px; }
    #msg { margin: 0; color: #9aa0b4; font-size: 15px; max-width: 320px; }
    #acoes { display: none; flex-direction: column; gap: 10px; margin-top: 6px; }
    #acoes.on { display: flex; }
    #acoes a, #acoes button { font: inherit; font-size: 15px; padding: 12px 22px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none; }
    #entrar { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
    #denovo { background: #1c1f2a; color: #e6e8ef; }
    #ativar { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); z-index: 5; }
    #ativar.on { display: flex; }
    #ativar .caixa { width: 100%; max-width: 480px; background: #161922; border-radius: 20px 20px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); text-align: center; }
    #ativar img { width: 56px; height: 56px; border-radius: 14px; }
    #ativar h2 { margin: 10px 0 6px; font-size: 18px; }
    #ativar p { margin: 0 0 16px; color: #9aa0b4; font-size: 14px; }
    #ativar button { display: block; width: 100%; font: inherit; font-size: 15px; padding: 13px; border-radius: 12px; border: 0; margin-top: 8px; cursor: pointer; }
    #ativarSim { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
    #ativarNao { background: #1c1f2a; color: #e6e8ef; }
  </style>
</head>
<body>
  <!-- Abre o Alpha IA (web app do Google Apps Script) em tela cheia. Esta página não tem dados:
       o acesso continua exigindo a conta Google do dono e a senha de 4 dígitos do site. -->
  <iframe id="site" title="Alpha IA" allow="clipboard-write; camera; microphone"></iframe>
  <div id="capa">
    <img src="icone-192.png?v=2" alt="">
    <h1>Alpha IA</h1>
    <p id="msg">Carregando…</p>
    <div id="acoes">
      <a id="entrar" target="_blank" rel="noopener">Entrar no Google</a>
      <button id="denovo" type="button">Tentar de novo</button>
    </div>
  </div>
  <div id="ativar">
    <div class="caixa">
      <img src="icone-192.png?v=2" alt="">
      <h2>Ativar notificações</h2>
      <p>Lembretes, contas vencendo e avisos do bot vão chegar neste celular com o ícone do Alpha IA.</p>
      <button id="ativarSim" type="button">Ativar</button>
      <button id="ativarNao" type="button">Agora não</button>
    </div>
  </div>
  <script>
    var SITE = 'https://script.google.com/macros/s/AKfycbwQimqlUYYDiTUtUSOk_wazLB_qvNQKsinJoKdSlb0_oy8Jgp8RBlMenOJaptthp4uFIg/exec';
    var ESPERA_MS = 20000; // sem aviso do site nesse tempo: provavelmente o login do Google venceu
    var url = SITE + location.search;
    var site = document.getElementById('site'), capa = document.getElementById('capa');
    var msg = document.getElementById('msg'), acoes = document.getElementById('acoes');
    var carregou = false, timer;
    var siteWin = null, siteOrigem = '', chavePush = '';
    document.getElementById('entrar').href = url;

    function abrir() {
      carregou = false; capa.classList.remove('fora'); acoes.classList.remove('on');
      msg.textContent = 'Carregando…';
      site.src = url;
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (carregou) return;
        msg.textContent = 'Não consegui abrir. Se o login do Google venceu, entre pelo botão abaixo e depois volte aqui.';
        acoes.classList.add('on');
      }, ESPERA_MS);
    }
    // O site avisa quando carregou e pede para ativar notificações (só aceita mensagem vinda das páginas do Apps Script).
    window.addEventListener('message', function (e) {
      if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
      if (e.data === 'painel-ok') {
        carregou = true; clearTimeout(timer); capa.classList.add('fora');
        siteWin = e.source; siteOrigem = e.origin; contarEstado();
      } else if (e.data && e.data.tipo === 'push-ativar' && e.source === siteWin) {
        chavePush = String(e.data.chave || ''); document.getElementById('ativar').classList.add('on');
      }
    });

    // ===== Notificações: o celular se inscreve aqui; a inscrição vai para o site, que entrega ao bot =====
    function paraSite(m) { if (siteWin) siteWin.postMessage(m, siteOrigem); }
    function temPush() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
    // Conta ao site se as notificações estão ativas (e manda a inscrição, para ele atualizar se mudou).
    function contarEstado() {
      if (!temPush()) return paraSite({ tipo: 'app', push: 'sem-suporte' });
      if (Notification.permission === 'denied') return paraSite({ tipo: 'app', push: 'negado' });
      navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (s) {
        paraSite(s && Notification.permission === 'granted' ? { tipo: 'app', push: 'ativo', sub: JSON.stringify(s) } : { tipo: 'app', push: 'pedir' });
      }).catch(function () { paraSite({ tipo: 'app', push: 'pedir' }); });
    }
    function bytesDaChave(b64) {
      var s = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4));
      return Uint8Array.from(s, function (c) { return c.charCodeAt(0); });
    }
    function ativarPush() {
      document.getElementById('ativar').classList.remove('on');
      if (!temPush()) return paraSite({ tipo: 'push-estado', push: 'sem-suporte' });
      Notification.requestPermission().then(function (p) {
        if (p !== 'granted') return paraSite({ tipo: 'push-estado', push: p === 'denied' ? 'negado' : 'pedir' });
        return navigator.serviceWorker.ready.then(function (reg) {
          // inscrição nova sempre (se a chave do bot mudou, a antiga não vale mais)
          return reg.pushManager.getSubscription().then(function (s) { return s && s.unsubscribe(); }).then(function () {
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytesDaChave(chavePush) });
          });
        }).then(function (s) { paraSite({ tipo: 'push-inscricao', sub: JSON.stringify(s) }); });
      }).catch(function (err) { paraSite({ tipo: 'push-erro', msg: 'Não consegui ativar: ' + (err && err.message || err) }); });
    }
    document.getElementById('ativarSim').onclick = ativarPush;
    document.getElementById('ativarNao').onclick = function () { document.getElementById('ativar').classList.remove('on'); };
    document.getElementById('denovo').onclick = abrir;
    // Voltou do login no Chrome: tenta de novo sozinho.
    document.addEventListener('visibilitychange', function () { if (!document.hidden && !carregou && acoes.classList.contains('on')) abrir(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    abrir();
  </script>
</body>
</html>
